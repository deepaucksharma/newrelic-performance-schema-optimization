AWSTemplateFormatVersion: 2010-09-09
Description: "New Relic - MySQL Performance Schema Optimization: Parameter Group + Lambda automation"

Parameters:
  Prefix:
    Type: String
    Default: "nr-mysql-ps"
    Description: "Prefix for all created resources"
  
  EngineFamily:
    Type: String
    Default: "mysql8.0"
    AllowedValues:
      - "mysql8.0"
      - "mysql5.7"
      - "aurora-mysql8.0"
      - "aurora-mysql5.7"
    Description: "MySQL/Aurora engine family"
  
  DatabaseId:
    Type: String
    Description: "RDS Instance ID or Aurora Cluster ID"
  
  IsAurora:
    Type: String
    AllowedValues: [true, false]
    Default: false
    Description: "Whether target is Aurora cluster (true) or RDS instance (false)"
  
  SqlBucket:
    Type: String
    Description: "S3 bucket for YAML configuration and Lambda code"
  
  SqlKey:
    Type: String
    Default: "target-config.yaml"
    Description: "S3 key for YAML configuration file"
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC where Lambda will run (must have access to RDS/Aurora)"
  
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Subnets where Lambda will run (must have access to RDS/Aurora)"
  
  DBSecretArn:
    Type: String
    Default: ""
    Description: "Optional SecretManager ARN for database credentials (if not using IAM auth)"
  
  UseIamAuth:
    Type: String
    AllowedValues: [true, false]
    Default: true
    Description: "Use IAM authentication for database connection"
    
  NewRelicAccountId:
    Type: String
    Default: ""
    Description: "Optional: New Relic account ID for logging"

Resources:
  # 1. Parameter Group (baseline)
  PSParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: !Ref EngineFamily
      Description: "New Relic optimized Performance Schema baseline"
      Parameters:
        performance_schema: "1"
        performance_schema_digests_size: "10000"
        performance_schema_max_sql_text_length: "4096"
        performance-schema-consumer-events-statements-current: "1"

  # 2. Lambda layer (Python libraries)
  PyLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleRuntimes: [python3.12]
      Content:
        S3Bucket: !Ref SqlBucket
        S3Key: pymysql-pyyaml-layer.zip
      Description: "PyMySQL and PyYAML for Performance Schema Lambda"

  # 3. Lambda function security group
  FnSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "New Relic Performance Schema Lambda outbound traffic"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
      Tags:
        - Key: Name
          Value: !Sub "${Prefix}-lambda-sg"

  # 4. Lambda execution role
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RDSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                Resource: "*"
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/${DB_USER}"
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SqlBucket}/${SqlKey}"
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If [UseSecretManager, !Ref DBSecretArn, !Ref "AWS::NoValue"]

  # 5. Lambda function (code uploaded separately)
  PerfSchemaFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-perf-schema-optimizer"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref SqlBucket
        S3Key: lambda.zip
      Timeout: 45
      MemorySize: 128
      Layers: [ !Ref PyLayer ]
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [ !GetAtt FnSG.GroupId ]
      Environment:
        Variables:
          SQL_BUCKET: !Ref SqlBucket
          SQL_KEY: !Ref SqlKey
          DB_ID: !Ref DatabaseId
          IS_AURORA: !Ref IsAurora
          IAM_AUTH: !Ref UseIamAuth
          DB_USER: lambda_perf_schema
          NR_ACCOUNT: !Ref NewRelicAccountId
          SECRET_ARN: !If [UseSecretManager, !Ref DBSecretArn, ""]

  # 6. CloudWatch LogGroup for Lambda
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PerfSchemaFn}"
      RetentionInDays: 14

  # 7. EventBridge Rules for Lambda triggers
  # Daily schedule
  DailyCheckRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Prefix}-daily-check"
      Description: "Daily verification of Performance Schema configuration"
      ScheduleExpression: "rate(1 day)"
      State: ENABLED
      Targets:
        - Id: LambdaTarget
          Arn: !GetAtt PerfSchemaFn.Arn

  # RDS events
  RDSEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Prefix}-rds-events"
      Description: "Trigger on RDS restart/failover events"
      EventPattern:
        source:
          - aws.rds
        detail-type:
          - RDS DB Instance Event
          - RDS DB Cluster Event
        detail:
          EventID:
            - RDS-EVENT-0004  # instance reboot
            - RDS-EVENT-0045  # failover complete 
            - RDS-EVENT-0046  # failover start
            - RDS-EVENT-0071  # reboot recovery
            - RDS-EVENT-0006  # restart
      State: ENABLED
      Targets:
        - Id: LambdaTarget
          Arn: !GetAtt PerfSchemaFn.Arn

  # 8. Event Rule permissions
  LambdaInvokePermissionDaily:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PerfSchemaFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyCheckRule.Arn

  LambdaInvokePermissionRDSEvents:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PerfSchemaFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RDSEventsRule.Arn

  # 9. CloudWatch Alarms (optional)
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Prefix}-lambda-errors"
      AlarmDescription: "Alert on Performance Schema Lambda failures"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref PerfSchemaFn
      TreatMissingData: notBreaching

Conditions:
  UseSecretManager: !Not [!Equals [!Ref DBSecretArn, ""]]

Outputs:
  ParameterGroupName:
    Description: "Parameter Group to attach to RDS/Aurora"
    Value: !Ref PSParameterGroup
  
  LambdaName:
    Description: "Lambda function name"
    Value: !Ref PerfSchemaFn
    
  LambdaLogGroupName:
    Description: "CloudWatch Log Group for Lambda"
    Value: !Ref LambdaLogGroup
    
  DailyCheckRuleName:
    Description: "EventBridge rule for daily checks"
    Value: !Ref DailyCheckRule
    
  RDSEventsRuleName:
    Description: "EventBridge rule for RDS events"
    Value: !Ref RDSEventsRule

  DB_USER:
    Description: "Database user required for Lambda"
    Value: lambda_perf_schema
